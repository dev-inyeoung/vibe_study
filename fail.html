<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 실패 | 토스 스토어</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="fail">
  <div data-header="simple"></div>

  <main class="result">
    <div class="result__icon result__icon--fail">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </div>
    <h1 class="result__title">결제에 실패했어요</h1>
    <p class="result__desc" data-message>잠시 후 다시 시도해주세요.</p>
    <dl class="result__box">
      <div class="result__row"><dt>에러 코드</dt><dd data-code>-</dd></div>
      <div class="result__row"><dt>주문번호</dt><dd data-order>-</dd></div>
    </dl>
    <div class="result__actions">
      <a class="btn btn--primary btn--block" href="checkout.html">다시 결제하기</a>
      <a class="btn btn--grey btn--block" href="tops.html">쇼핑 계속하기</a>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      // failUrl 쿼리: code, message, orderId
      const params = new URLSearchParams(location.search);
      if (params.get('message')) document.querySelector('[data-message]').textContent = params.get('message');
      if (params.get('code')) document.querySelector('[data-code]').textContent = params.get('code');
      if (params.get('orderId')) document.querySelector('[data-order]').textContent = params.get('orderId');
      window.Shop.PendingOrder.clear();
    })();
  </script>
</body>
</html>
