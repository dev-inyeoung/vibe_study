<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문/결제 | 토스 스토어</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <!-- 토스페이먼츠 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body data-page="checkout">
  <div data-header="simple"></div>

  <main class="container">
    <h1 class="page-title">주문/결제</h1>

    <!-- 장바구니가 비었을 때 -->
    <section class="empty" data-empty hidden>
      <div class="empty__icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8b95a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      </div>
      <p class="empty__title">장바구니가 비어 있어요</p>
      <p class="empty__desc">마음에 드는 상품을 담아보세요</p>
      <a class="btn btn--primary" href="tops.html">쇼핑하러 가기</a>
    </section>

    <div class="checkout" data-checkout hidden>
      <div class="checkout__main">
        <section class="section">
          <h2 class="section__title">주문 상품 <span class="section__sub" data-count></span></h2>
          <div data-lines></div>
        </section>

        <section class="section">
          <h2 class="section__title">주문자 정보</h2>
          <form data-form novalidate>
            <label class="field">
              <span class="field__label">이름</span>
              <input class="field__input" name="name" autocomplete="name" placeholder="홍길동" required>
              <span class="field__error">이름을 입력해주세요</span>
            </label>
            <label class="field">
              <span class="field__label">휴대폰 번호</span>
              <input class="field__input" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01012345678" required>
              <span class="field__error">휴대폰 번호를 정확히 입력해주세요</span>
            </label>
            <label class="field">
              <span class="field__label">이메일</span>
              <input class="field__input" name="email" type="email" autocomplete="email" placeholder="example@toss.im" required>
              <span class="field__error">이메일 형식을 확인해주세요</span>
            </label>
            <label class="field">
              <span class="field__label">배송지</span>
              <input class="field__input" name="address" autocomplete="street-address" placeholder="서울특별시 강남구 테헤란로 131" required>
              <span class="field__error">배송지를 입력해주세요</span>
            </label>
          </form>
        </section>

        <section class="section">
          <h2 class="section__title">결제 수단</h2>
          <div class="widget-box">
            <!-- 토스페이먼츠 결제위젯: 결제 수단 -->
            <div id="payment-method"></div>
            <!-- 토스페이먼츠 결제위젯: 이용약관 -->
            <div id="agreement"></div>
          </div>
        </section>
      </div>

      <aside class="checkout__aside">
        <section class="section">
          <h2 class="section__title">결제 금액</h2>
          <div data-summary></div>
          <p class="summary__notice">50,000원 이상 구매 시 무료배송이에요.<br>테스트 결제라서 실제로 돈이 빠져나가지 않아요.</p>
        </section>
        <div class="pay-bar">
          <button type="button" class="btn btn--primary btn--block" data-pay disabled>결제 준비 중…</button>
        </div>
      </aside>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/common.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
